name: Android Debug & Release Build

on:
  push:
    branches: [main]
    paths:
      - '**'
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [debug, release, both]
        default: 'both'
        required: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx3g -XX:+HeapDumpOnOutOfMemoryError"'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK(s)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Java ────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ── Setup Node ────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── Install npm deps ─────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ── Build web assets ─────────────────────────────────────
      - name: Build web app (Vite + PWA)
        run: npm run build
        env:
          VITE_PWA_ENABLED: 'true'
          VITE_OFFLINE_ENABLED: 'true'
          VITE_MOBILE_LAYOUT_ENABLED: 'true'

      # ── Capacitor sync ───────────────────────────────────────
      - name: Capacitor sync Android
        run: npx cap sync android

      # ── Make gradlew executable ──────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      # ── Build Debug APK ──────────────────────────────────────
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' || github.event_name != 'workflow_dispatch' }}
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Build Release APK (unsigned) ─────────────────────────
      - name: Build Release APK (unsigned)
        if: ${{ github.event.inputs.build_type != 'debug' || github.event_name != 'workflow_dispatch' }}
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── Upload Debug APK ─────────────────────────────────────
      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 6

      # ── Upload Release APK ───────────────────────────────────
      - name: Upload Release APK (unsigned)
        if: ${{ github.event.inputs.build_type != 'debug' || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          compression-level: 6

      # ── Summary ──────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Type | Installable |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| app-debug-apk | Debug | ✅ Yes (direct install) |" >> $GITHUB_STEP_SUMMARY
          echo "| app-release-unsigned-apk | Release | ❌ Needs signing |" >> $GITHUB_STEP_SUMMARY